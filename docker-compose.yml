services:
  mysql:
    image: mysql:8.4
    container_name: procureflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_only
      MYSQL_DATABASE: procureflow
      MYSQL_USER: procureflow
      MYSQL_PASSWORD: procureflow_dev
    ports:
      - "3306:3306"
    volumes:
      - procureflow_mysql:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_dev_only"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  procureflow_mysql:

